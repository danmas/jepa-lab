schema: spec-driven

context: |
  jepa-lab: учебная JEPA на CPU. Python 3.12, torch (CPU), numpy, pillow, matplotlib.
  Новые зависимости только через спеку.
  Код: корень репозитория. База знаний: KB/. Чекпоинты v0.3: out/jepa_v4.pt, out/pixel_v4.pt, out/probe_v4.pt.
  Мир: кадр 64×64, 9 действий, GRAVITY 0.15, IMPULSE 4.0, VEL_DECAY 0.6, SIGMA 2.8.
  Модель: латент 48, единичная норма, предиктор с геометрией действия и приращением, лосс на трёх шагах (HORIZON = 6).
  План: фраза → таблица data.find_zone → z_goal = E_ema(кадр цели). CEM 128×8, горизонт 10, в латенте.
  MPC делает одно действие и перепланирует. Успех проверяется в World. Потолок eval и demo_ui — 20 шагов.
  На 90 эпизодах: latent около 82%, mixed около 73%, решение около 70 мс.
  Страница проверки: python demo_ui.py, http://127.0.0.1:8765.
  Архив v0.2: out/jepa.pt, out/pixel.pt, out/metrics.json. Текущие data.py и Predictor этот прогон не повторяют.
  Пустой --tag у train.py затирает out/jepa.pt.
  Текст спек можно писать по-русски. Нормативные слова — SHALL/MUST, сценарии — #### Scenario, WHEN/THEN.
  Код приложения не менять, пока изменение не прошло openspec validate --strict и пользователь не попросил его выполнить.

rules:
  proposal:
    - "Писать по-русски. Имена возможностей в kebab-case, как папки specs."
    - "В proposal нет шагов реализации. Шаги живут в design и tasks."
  specs:
    - "У каждого требования есть хотя бы один сценарий с заголовком из четырёх решёток."
    - "Нормативные глаголы SHALL или MUST. Формат сценария: WHEN и THEN."
  tasks:
    - "Только чекбоксы. В спеке, которая ещё не выполняется, задачи не отмечать сделанными."
